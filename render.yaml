services:
  - type: web
    name: sarthi-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WHISPER_MODEL
        value: tiny
      - key: CPU_THREADS
        value: 4
